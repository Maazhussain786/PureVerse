# PureVerse backend on a DigitalOcean Droplet.
#   - backend: Express + Socket.io API (JSON store on a persistent bind mount)
#   - caddy:   reverse proxy with automatic HTTPS (Let's Encrypt)
#
# First run:
#   1. Copy .env.example -> .env and fill it in
#   2. Edit Caddyfile: replace api.example.com with your real domain
#   3. docker compose up -d --build
#
# Data lives in ./data/db.json on the host and survives rebuilds/restarts.

services:
  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    expose:
      - "5000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/party/rooms"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  # Optional TURN relay for watch-party voice (WebRTC). Without TURN, voice only
  # connects on simple NAT (often only same Wi-Fi); TURN makes it work across
  # mobile data / strict NAT. Opt-in so the default deploy is unchanged:
  #   docker compose --profile voice up -d --build
  # Firewall: open UDP+TCP 3478 and UDP 49160-49200 on the droplet. Set TURN_* in
  # .env, and point TURN_URLS (served to clients via /api/rtc/ice) at this host.
  coturn:
    image: coturn/coturn:4.6-alpine
    restart: unless-stopped
    network_mode: host
    profiles: ["voice"]
    command: >
      -n --log-file=stdout
      --lt-cred-mech --fingerprint
      --no-tls --no-dtls --no-cli
      --realm=${TURN_REALM:-pureverse}
      --user=${TURN_USERNAME}:${TURN_PASSWORD}
      --external-ip=${TURN_PUBLIC_IP}
      --listening-port=3478
      --min-port=49160 --max-port=49200

volumes:
  caddy_data:
  caddy_config:
