name: Build Android APK

# Builds the PureVerse WebView APK in the cloud so you can download the .apk
# from the run's "Artifacts" without installing Android Studio.
# Trigger it manually from the Actions tab (Run workflow) or on push to android/.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to publish the APK as a Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PureVerse-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publish the raw .apk to a Release so phones get a direct, login-free,
      # no-unzip download link: .../releases/latest -> tap app-debug.apk.
      - name: Publish APK to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --title "PureVerse APK (latest build)" \
            --notes "Tap **app-debug.apk** below to install on Android. Enable 'Install unknown apps' when prompted."
